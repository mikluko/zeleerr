overlay: 1.0.0
info:
  title: What Seerr takes and its spec does not say
  version: 1.0.0
actions:
  # Without a password Seerr mails the new user a generated one, and fails
  # when email notifications are off.
  - target: $.paths['/user'].post.requestBody.content['application/json'].schema.properties
    update:
      password:
        type: string
  - target: $.components.schemas.MediaRequest.properties
    update:
      type:
        type: string
        enum: [movie, tv]
      seasons:
        type: array
        items:
          type: object
          properties:
            seasonNumber:
              type: integer
  - target: $.components.schemas.MediaInfo.properties
    update:
      mediaType:
        type: string
        enum: [movie, tv]
  # Described as an array of arrays; Seerr sends an array of objects, and the
  # details fail to decode. zeleerr does not read it.
  - target: $.components.schemas.MovieDetails.properties.watchProviders
    remove: true
  - target: $.components.schemas.TvDetails.properties.watchProviders
    remove: true
